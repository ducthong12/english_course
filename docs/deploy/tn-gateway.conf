map "$request_method|$http_origin" $tn_bad_origin {
    default 0;
    ~^(POST|PUT|PATCH|DELETE)[|] 1;
    "POST|https://english.ducthong.online" 0;
    "PUT|https://english.ducthong.online" 0;
    "PATCH|https://english.ducthong.online" 0;
    "DELETE|https://english.ducthong.online" 0;
}
map $http_origin $tn_internal_origin {
    default "";
    "https://english.ducthong.online" "http://127.0.0.1:8765";
}
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}
server {
    listen 8080;
    server_name english.ducthong.online;
    client_max_body_size 64k;
    if ($tn_bad_origin) { return 403; }

    location / {
        proxy_pass http://host.docker.internal:8765;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header Origin $tn_internal_origin;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cookie_flags lingo_session secure httponly samesite=lax;
    }
}

