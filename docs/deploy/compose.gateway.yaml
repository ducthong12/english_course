services:
  tn-gateway:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./tn-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8780:8080"
    networks:
      edge:
        aliases:
          - tn-gateway
networks:
  edge:
    external: true
    name: edge
